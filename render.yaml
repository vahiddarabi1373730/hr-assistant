services:
  - type: web
    name: hr-assist-backend
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /healthz
    envVars:
      - key: HR_MIGRATION_DATABASE_URL
        sync: false
      - key: HR_APP_DATABASE_URL
        sync: false
      - key: HR_APP_DB_PASSWORD
        sync: false
      - key: HR_RESET_PASSWORD_TOKEN_SECRET
        generateValue: true
      - key: HR_VERIFICATION_TOKEN_SECRET
        generateValue: true
      - key: HR_COOKIE_SECURE
        value: "true"
      - key: HR_RESUME_AI_PROVIDER
        value: groq
      - key: HR_GROQ_API_KEY
        sync: false
      - key: HR_GOOGLE_CLIENT_ID
        sync: false
      - key: HR_GOOGLE_CLIENT_SECRET
        sync: false
      - key: HR_GOOGLE_TOKEN_ENCRYPTION_KEY
        sync: false
      - key: HR_GOOGLE_REDIRECT_URI
        value: https://hr-assist-backend-4dmd.onrender.com/api/google/callback
      - key: HR_PUBLIC_FRONTEND_URL
        value: https://hr-assist-137132cc.netlify.app
      - key: HR_RESUME_EXTRACT_MODEL
        value: qwen/qwen3.8-27b
      - key: HR_RESUME_EXTRACT_MODEL_ESCALATION
        value: qwen/qwen3.8-27b
      - key: HR_OCR_ENABLED
        value: "false"
      - key: HR_VISION_ENABLED
        value: "true"
